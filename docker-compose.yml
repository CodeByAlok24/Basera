services:
  postgres:
    image: postgres:16-alpine
    container_name: basera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: basera
      POSTGRES_USER: basera
      POSTGRES_PASSWORD: basera_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basera -d basera"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: basera-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

